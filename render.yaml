services:
  - type: web
    name: carepoint-hospital-system
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
    disk:
      name: carepoint-data
      mountPath: /app/data
      sizeGB: 1
